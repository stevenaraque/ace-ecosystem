# ─── Perfil de Producción (Render) ───
# Se activa con SPRING_PROFILES_ACTIVE=prod (seteado en el Dockerfile).
# Render inyecta automáticamente la variable de entorno PORT.
#
# Las credenciales de Supabase se mantienen hardcodeadas aquí (decisión del equipo).
# Si en el futuro se necesitan variables de entorno, reemplazar por:
#   username: ${DB_USERNAME:postgres.artujprgqdhhtkwcisxv}
#   password: ${DB_PASSWORD:ACEpass69**ACE}

spring:
  # ─── Base de datos (Supabase) ───
  datasource:
    url: jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require
    username: postgres.artujprgqdhhtkwcisxv
    password: ACEpass69**ACE
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3          # Render free/starter tiene RAM limitada
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000

  # ─── JPA ───
  jpa:
    hibernate:
      ddl-auto: validate           # Flyway maneja el schema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false          # No formatear SQL en prod
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false

  # ─── Flyway (migraciones) ───
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:5432/postgres?prepareThreshold=0&sslmode=require
    user: postgres.artujprgqdhhtkwcisxv
    password: ACEpass69**ACE
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    schemas: public
    placeholders:
      app_name: A.C.E Backend

  # ─── Actuator (producción) ───
  management:
    endpoint:
      health:
        show-details: never        # No exponer internals en /actuator/health
        probes:
          enabled: true
    endpoints:
      web:
        exposure:
          include: health,info     # Solo health e info expuestos

# ─── JWT ───
jwt:
  secret: ${JWT_SECRET:ace-super-secret-key-min-32-characters-long!!}
  issuer: ace-backend

# ─── Servidor ───
server:
  port: ${PORT:8080}
  servlet:
    context-path: /

# ─── Logging (producción) ───
logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
    sena.adso: INFO
    com.zaxxer.hikari: WARN
