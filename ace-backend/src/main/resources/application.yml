spring:
  application:
    name: ace-backend

  datasource:
    # Supabase Connection Pooler (modo transaccional)
    url: jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require
    username: postgres.artujprgqdhhtkwcisxv
    password: ACEpass69**ACE
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway crea el schema; JPA solo valida
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway requiere bloqueos a nivel de sesión, por lo que debe usar el puerto 5432 (session pooler/directo)
    url: jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:5432/postgres?prepareThreshold=0&sslmode=require
    user: postgres.artujprgqdhhtkwcisxv
    password: ACEpass69**ACE
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    schemas: public
    placeholders:
      app_name: A.C.E Backend

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

logging:
  level:
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    sena.adso: DEBUG
