version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: ace-postgres
    environment:
      POSTGRES_USER: ace
      POSTGRES_PASSWORD: ace
      POSTGRES_DB: ace_db
    ports:
      - "5432:5432"
    volumes:
      - ace_pg_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ace-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ace.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  ace_pg_data:
