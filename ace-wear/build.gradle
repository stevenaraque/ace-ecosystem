plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ace.wear'
    compileSdk 34

    defaultConfig {
        applicationId "com.ace.wear"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear.compose:compose-material:1.3.1'
    implementation 'androidx.wear.compose:compose-foundation:1.3.1'

    // Health Services API (Wear OS 3+)
    implementation 'androidx.health:health-services-client:1.0.0-rc02'

    // Wearable Data Layer (sincronización con móvil)
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0'

    // A.C.E Shared (opcional en wear; estructura lista)
    // implementation files('../ace-shared/build/libs/ace-shared-1.0.0-SNAPSHOT.jar')
}
